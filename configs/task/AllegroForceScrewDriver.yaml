name: AllegroForceScrewDriver
physics_engine: ${..physics_engine}
on_evaluation: False
eval_cache_name: debug

env:
  initPose: 'screwdriver_inclined'
  numEnvs: ${resolve_default:8192,${...num_envs}}
  numActions: 20            # allegro v6 = 5 finger x 4 joint
  numObservations: 120      # 3 step x (20 관절위치 + 20 목표). 안 주면 96 으로 잘림

  # 초기 파지 자세 (URDF DOF 순서 = joint00..03=엄지, 10..13=검지, 20..23=중지, 30..33=약지, 40..43=소지)
  # ★ IK 로 푼 자세를 시뮬에서 300스텝 안정화시킨 값(= 도달 가능한 자세).
  # IK 원값은 joint30/joint01 을 관절한계로 밀어 effort 0.38Nm 으로 도달 불가 -> 영구 위치오차 ->
  # PD 가 계속 큰 토크를 뿜음 -> torque_penalty=(토크^2).sum() 이 10.587 (XHand 0.149) 로 리워드를 지배.
  # 안정화 후 0.330. 위치오차 0.135 -> 0.026 rad (XHand 0.046 보다 좋음).
  initPoseValues: [
                     0.5148,  -0.5633,   0.7519,  -0.0049,
                     0.2807,   0.7087,   0.0054,  -0.0281,
                     0.1312,   1.3075,  -0.0210,  -0.0638,
                    -0.2177,   1.1679,   0.0111,   0.0966,
                    -0.3136,   0.9443,  -0.1610,  -0.1548]
  envSpacing: 0.5

  episodeLength: 800
  aggregateMode: 1

  controller:
    torque_control: True
    controlFrequencyInv: 10  # 20Hz
    pgain: 3
    dgain: 0.01 
    action_scale: 0.05
    effort_limit: 0.38        # URDF 좌우 불일치라 코드에서 균일 적용
    torque_limit: 300.0

  rotation_axis: '+z'

  clipObservations: 5.0
  clipActions: 1.0
  reset_dist_threshold: 0.12   # 손 크기 비례(XHand 0.1). 학습 스크립트가 덮어쓰지만 기본값도 맞춰둠
  reset_z_threshold: 0.0

  # Random forces applied to the object
  forceScale: 2.0
  randomForceProbScalar: 0.25
  forceDecay: 0.9
  forceDecayInterval: 0.08

  hora:
    propHistoryLen: 30
    point_cloud_sampled_dim: 100

  reward:
    angvelClipMin: -4.0
    angvelClipMax: 4.0
    # Angular velocity penalty threshold curriculum: [init_threshold, final_threshold, start_step, end_step]
    # angvelPenaltyThres: 10.0  # Fixed threshold (no curriculum)
    angvelPenaltyThres: [7.5, 15.0, 30000000, 60000000]
    rotate_reward_scale: 2.5
    pose_diff_penalty_scale: -0.1
    torque_penalty_scale: -0.5   # XHand -3.0. 관절 20개 + 제곱합이라 손에 맞춰 축소
    work_penalty_scale: -0.01
    rotate_penalty_scale: -0.3
    pc_z_dist_penalty_scale: -1.0
    proximity_reward_scale: 2.0
  
  baseObjScale: 1.0
  randomization:
    randomizeMass: True
    randomizeMassLower: 0.04
    randomizeMassUpper: 0.06
    randomizeCOM: True
    randomizeCOMLower: -0.001
    randomizeCOMUpper: 0.001
    randomizeFriction: True
    randomizeFrictionLower: 0.5
    randomizeFrictionUpper: 8.0
    randomizeScale: True
    randomize_hand_scale: False
    # if scale_list_init is True, randomizeScaleLower and randomizeScaleUpper is not useful
    scaleListInit: True
    randomizeScaleList: [1.00, 1.03, 1.06, 1.09, 1.12, 1.15, 1.18, 1.21, 1.25]   # 손잡이 25~31mm. [1.05~1.45]=36mm 는 초기자세가 관통해 토크 폭주
    randomizeScaleLower: 0.80
    randomizeScaleUpper: 1.20
    randomizePDGains: True
    randomizePGainLower: 2.7
    randomizePGainUpper: 3.3
    randomizeDGainLower: 0.009 
    randomizeDGainUpper: 0.011 
    obs_noise_e_scale: 0.01
    obs_noise_t_scale: 0.005
    pose_noise_scale: 0
    action_noise_e_scale: 0.01
    action_noise_t_scale: 0.005
    # stage 2 specific:
    noisy_rpy_scale: 0.1
    noisy_pos_scale: 0.02

  privInfo:
    enableObjPos: True
    enableObjScale: True
    enableObjMass: True
    enableObjCOM: True
    enableObjFriction: True
    enable_obj_restitution: True
    enable_tactile: False
    contact_input_dim: 4
    contact_form: 'gpu_contact'
    contact_input: 'binary'
    contact_binarize_threshold: 0.1
    enable_obj_orientation: True 
    enable_obj_linvel: True 
    enable_obj_angvel: True 
    enable_ft_pos: True 
    enable_ft_orientation: True 
    enable_ft_linvel: True 
    enable_ft_angvel: True 
    enable_hand_scale: True 
    enable_nut_contact: True
    enable_nut_pos: True
    enable_nut_dof_vel: True
    enable_nut_dof_pos: True
    enable_screw_joint_friction: True
    enable_hand_position: False
    enable_hand_orientation: False
    enable_hand_joint_pos: False
    enable_pgain: False
    enable_dgain: False


  object:
    type: 'screw_driver'
    evalObjectType: null # set to a string object name to evaluate on only one object
    sampleProb: [1.0]
    nut_termination_history_len: 60
    nut_stagnation_eps: 0.003
    screw_upper_limit: 628.3185
    thumb_range_limit: False   # XHand 9번 관절 전용이라 Allegro 에선 끔
    object_tilt: True  # Enable ±5 degree object tilt randomization

  asset:
    handAsset: "assets/allegro_v6_force_l/urdf/V6_Force_L.urdf"
    # 순서는 XHand 원본과 동일하게 [index, mid, pinky, ring, thumb].
    # v6 왼손 링크는 R{체인}{단계}_Link 형식이고 체인 1=엄지, 2=검지, 3=중지, 4=약지, 5=소지.
    # (오른손 URDF 로 바꿀 때는 thumb_tip/index_tip/... 으로 교체)
    fingertipLinks: ["index_3", "middle_3", "pinky_3", "ring_3", "thumb_3"]
    # 손 베이스 포즈. XHand 손끝 배치에 Allegro 손끝을 Kabsch 정렬해서 얻은 값.
    # XHand 원본은 pos [0,0,0.21] / X축 65deg 였다. ★ 파지 튜닝 대상.
    handStartPos: [-0.0718,0.0285,0.2236]   # Kabsch 정렬점 + 접근축 30mm 후퇴 (스윕: 20/40/50mm 는 3~6만N 관통)
    # 손 국소 프레임 보정 회전(xyzw). 리셋 때 계산되는 공칭 회전에 R_world = R_nominal @ R_mount 로 합성된다.
    # XHand 손끝 배치에 Allegro 손끝 5개를 Kabsch 정렬해 구한 값. ★ 파지 튜닝 대상.
    handMountQuat: [0.827820, -0.355846, 0.419912, -0.108452]

  # set to True if you use camera sensors in the environment
  enableCameraSensors: False

sim:
  dt: 0.005 # 200 Hz
  substeps: 1
  up_axis: 'z'
  use_gpu_pipeline: ${eq:${...pipeline},'gpu'}
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    use_gpu: ${contains:'cuda',${....sim_device}} # set to False to run on CPU
    num_position_iterations: 8
    num_velocity_iterations: 0
    max_gpu_contact_pairs: 8388608 # 8*1024*1024
    num_subscenes: ${....num_subscenes}
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
    contact_collection: 1 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (default - all contacts)